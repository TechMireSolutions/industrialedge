name: Deploy Industrial Edge V2 (Main)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 11092
          script: |
            set -e
            cd /www/wwwroot/industrialedgev2.techmiresolutions.com

            # 1. Production .env files ka safety backup lein
            cp .env /tmp/.env.prod.bak 2>/dev/null || true
            cp backend/.env /tmp/backend.env.prod.bak 2>/dev/null || true
            cp frontend/.env /tmp/frontend.env.prod.bak 2>/dev/null || true

            # 2. Local changes reset karein taake '.env not uptodate' ka error na aye
            git reset --hard
            git clean -fd

            # 3. Main branch ka latest code fetch aur checkout karein
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main

            # 4. Production .env files wapas restore karein
            [ -f /tmp/.env.prod.bak ] && cp /tmp/.env.prod.bak .env
            [ -f /tmp/backend.env.prod.bak ] && cp /tmp/backend.env.prod.bak backend/.env
            [ -f /tmp/frontend.env.prod.bak ] && cp /tmp/frontend.env.prod.bak frontend/.env

            # 5. Dependencies install aur Next.js production build run karein
            npm install
            chmod -R +x node_modules/.bin frontend/node_modules/.bin backend/node_modules/.bin 2>/dev/null || true
            CI=true npm run build

            # 6. PM2 backend aur frontend processes restart karein
            pm2 restart industrialv2-backend
            pm2 restart industrialv2-frontend
            pm2 save
