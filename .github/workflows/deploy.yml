name: Deploy Industrial Edge V2 (Main)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 11092
          script: |
            set -e
            cd /www/wwwroot/industrialedgev2.techmiresolutions.com

            # 1. Production .env files ka safety backup lein
            cp .env /tmp/.env.prod.bak 2>/dev/null || true
            cp backend/.env /tmp/backend.env.prod.bak 2>/dev/null || true
            cp frontend/.env /tmp/frontend.env.prod.bak 2>/dev/null || true

            # 2. Main branch ka latest code fetch karein
            git fetch origin main

            # 3. Local .env files remove karein taake git checkout overwrite error na de
            rm -f .env backend/.env frontend/.env

            # 4. Main branch force checkout aur reset karein
            git checkout -f -B main origin/main
            git reset --hard origin/main

            # 5. Production .env files wapas restore karein
            [ -f /tmp/.env.prod.bak ] && cp /tmp/.env.prod.bak .env
            [ -f /tmp/backend.env.prod.bak ] && cp /tmp/backend.env.prod.bak backend/.env
            [ -f /tmp/frontend.env.prod.bak ] && cp /tmp/frontend.env.prod.bak frontend/.env

            # 6. Broken architecture symlinks remove karein aur clean install karein
            rm -rf node_modules/@tailwindcss frontend/node_modules/@tailwindcss
            npm install --legacy-peer-deps --no-audit --no-fund || {
              echo "Retrying clean install due to stale node_modules tree..."
              rm -rf node_modules frontend/node_modules backend/node_modules
              npm install --legacy-peer-deps --no-audit --no-fund
            }

            chmod -R +x node_modules/.bin frontend/node_modules/.bin backend/node_modules/.bin 2>/dev/null || true
            NEXT_TELEMETRY_DISABLED=1 npm run build

            # 7. PM2 backend aur frontend processes restart ya start karein
            pm2 restart industrialv2-backend || PORT=5007 pm2 start backend/server.js --name industrialv2-backend
            pm2 restart industrialv2-frontend || PORT=3005 pm2 start "npm run start --prefix frontend -- -p 3005" --name industrialv2-frontend
            pm2 save
